<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMING!</title>

<!-- Discord / Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="🎮 GAMING!">
<meta property="og:url" content="https://cianan7.github.io/dalies/">
<meta property="og:image" content="https://cianan7.github.io/dalies/gaming-preview-clean.png">
<meta property="og:image:secure_url" content="https://cianan7.github.io/dalies/gaming-preview-clean.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🎮 GAMING!">
<meta name="twitter:image" content="https://cianan7.github.io/dalies/gaming-preview-clean.png">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 15% 15%, rgba(124,58,237,.20), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(37,99,235,.16), transparent 38%),
        #07070b;
}

.container {
    width: min(1120px, 92%);
    margin: auto;
    padding: 70px 0;
}

.hero {
    text-align: center;
    padding: 38px 20px 48px;
}

h1 {
    margin-top: 20px;
    font-size: clamp(64px, 12vw, 120px);
    line-height: .88;
    letter-spacing: -8px;
    font-weight: 900;
    background: linear-gradient(90deg,#fff,#c4b5fd,#60a5fa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.open-all {
    margin-top: 30px;
    padding: 17px 44px;
    border: 0;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(135deg,#7c3aed,#2563eb);
}

.games {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.game {
    padding: 26px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    background: rgba(255,255,255,.035);
}

.number {
    color:#6f6f7d;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
}

.game h2 {
    margin-top: 14px;
    font-size: 27px;
}

.game p {
    margin-top: 8px;
    color:#888895;
    font-size:13px;
    line-height:1.55;
    min-height:42px;
}

.open {
    width:100%;
    margin-top:22px;
    padding:12px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(255,255,255,.055);
    color:white;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:760px){
    .games{grid-template-columns:1fr}
    h1{letter-spacing:-5px}
}
</style>
</head>

<body>
<div class="container">

<section class="hero">
    <h1>GAMING!</h1>
    <button class="open-all" onclick="openAll()">⚡ OPEN ALL</button>
</section>

<section class="games">

<div class="game">
    <div class="number">GAME 01</div>
    <h2>Episode</h2>
    <p>Today's Episode challenge.</p>
    <button class="open" onclick="openGame('https://episode.wtf/')">PLAY →</button>
</div>

<div class="game">
    <div class="number">GAME 02</div>
    <h2>Framed</h2>
    <p>Guess the movie from the frame.</p>
    <button class="open" onclick="openGame('https://framed.wtf/')">PLAY →</button>
</div>

<div class="game">
    <div class="number">GAME 03</div>
    <h2>Flickle</h2>
    <p>Your daily movie challenge.</p>
    <button class="open" onclick="openGame('https://flickle.app/archive?page=38')">PLAY →</button>
</div>

</section>
</div>

<script>
const games = [
    "https://episode.wtf/",
    "https://framed.wtf/",
    "https://flickle.app/archive?page=38"
];

function openGame(url) {
    window.open(url, "_blank", "noopener");
}

function openAll() {
    games.forEach(url => window.open(url, "_blank", "noopener"));
}
</script>
</body>
</html>
