<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMING!</title>

<!-- Discord Embed -->
<meta property="og:type" content="website">
<meta property="og:title" content="🎮 GAMING!">
<meta property="og:url" content="https://cianan7.github.io/dalies/">
<meta property="og:image" content="https://cianan7.github.io/dalies/gaming-preview.png">
<meta property="og:image:secure_url" content="https://cianan7.github.io/dalies/gaming-preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🎮 GAMING!">
<meta name="twitter:image" content="https://cianan7.github.io/dalies/gaming-preview.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 18% 10%, rgba(124,58,237,.18), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(37,99,235,.15), transparent 32%),
        #07070b;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, #000, transparent 70%);
}

.container {
    width: min(1180px, 92%);
    margin: 0 auto;
    padding: 65px 0 55px;
    position: relative;
    z-index: 1;
}

.hero {
    text-align: center;
    padding: 20px 0 50px;
}

h1 {
    font-size: clamp(70px, 12vw, 125px);
    line-height: .9;
    letter-spacing: -8px;
    font-weight: 900;
    background: linear-gradient(90deg, #eee7ff, #b9a7ff 52%, #7898ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.open-all {
    margin-top: 30px;
    min-width: 220px;
    padding: 17px 34px;
    border: 0;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(135deg, #7437f5, #2e62ea);
    box-shadow: 0 14px 36px rgba(77,59,220,.28);
    transition: .18s ease;
}

.open-all:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 44px rgba(77,59,220,.42);
}

.game-count {
    margin-top: 13px;
    color: #666674;
    font-size: 12px;
    letter-spacing: 1px;
}

.games {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 16px;
}

.game {
    min-width: 0;
    padding: 22px;
    border: 1px solid rgba(255,255,255,.075);
    border-radius: 18px;
    background: rgba(255,255,255,.032);
    transition: .18s ease;
}

.game:hover {
    transform: translateY(-3px);
    border-color: rgba(155,130,255,.28);
    background: rgba(255,255,255,.05);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.number {
    color: #666674;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
}

.type {
    color: #858594;
    font-size: 10px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 5px 8px;
    white-space: nowrap;
}

.game h2 {
    margin-top: 15px;
    font-size: 23px;
    letter-spacing: -.5px;
}

.open {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    background: rgba(255,255,255,.045);
    color: white;
    font-weight: 800;
    cursor: pointer;
    transition: .16s ease;
}

.open:hover {
    background: rgba(255,255,255,.10);
}

footer {
    margin-top: 45px;
    text-align: center;
    color: #454551;
    font-size: 11px;
    letter-spacing: 1.5px;
}

@media (max-width: 900px) {
    .games { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 580px) {
    .games { grid-template-columns: 1fr; }
    .container { padding-top: 40px; }
    h1 { letter-spacing: -5px; }
}
</style>
</head>

<body>
<div class="container">

    <section class="hero">
        <h1>GAMING!</h1>
        <button class="open-all" id="openAll">⚡ OPEN ALL</button>
        <div class="game-count">18 DAILY GAMES</div>
    </section>

    <section class="games" id="games"></section>

    <footer>GAMING!</footer>

</div>

<script>
const games = [
    { name: 'Episode', url: 'https://episode.wtf/', type: 'TV' },
    { name: 'Framed', url: 'https://framed.wtf/', type: 'Movies' },
    { name: 'Flickle', url: 'https://flickle.app/archive?page=38', type: 'Movies' },
    { name: 'LoLdle', url: 'https://loldle.net/', type: 'League of Legends' },
    { name: 'Flagle', url: 'https://www.flagle.io/', type: 'Flags' },
    { name: 'Globle', url: 'https://globle-game.com/', type: 'Geography' },
    { name: 'Worldle', url: 'https://worldle.teuteuf.fr/', type: 'Geography' },
    { name: 'WhereTaken', url: 'https://wheretaken.teuteuf.fr/', type: 'Geography' },
    { name: 'Travle', url: 'https://travle.earth/', type: 'Geography' },
    { name: 'LessGames', url: 'https://lessgames.com/', type: 'Daily Games' },
    { name: 'Bandle', url: 'https://bandle.app/menu', type: 'Music' },
    { name: 'Rock Heardle', url: 'https://rock.heardledecades.com/', type: 'Music' },
    { name: '10s Heardle', url: 'https://10s.heardledecades.com/', type: 'Music' },
    { name: 'Tasted Tracks', url: 'https://www.tastedtracks.com/game', type: 'Music' },
    { name: 'Betweenle', url: 'https://betweenle.com/', type: 'Daily Game' },
    { name: 'Gamedle', url: 'https://www.gamedle.wtf/', type: 'Video Games' },
    { name: 'GuessThe.Game', url: 'https://guessthe.game/', type: 'Video Games' },
    { name: 'Pokédle', url: 'https://pokedle.com/image-zoom', type: 'Pokémon' }
];

const grid = document.getElementById("games");

games.forEach((game, index) => {
    const card = document.createElement("div");
    card.className = "game";

    const top = document.createElement("div");
    top.className = "top";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = "GAME " + String(index + 1).padStart(2, "0");

    const type = document.createElement("div");
    type.className = "type";
    type.textContent = game.type;

    const title = document.createElement("h2");
    title.textContent = game.name;

    const button = document.createElement("button");
    button.className = "open";
    button.textContent = "PLAY →";
    button.addEventListener("click", () => {
        window.open(game.url, "_blank", "noopener");
    });

    top.append(number, type);
    card.append(top, title, button);
    grid.appendChild(card);
});

document.getElementById("openAll").addEventListener("click", () => {
    games.forEach(game => {
        window.open(game.url, "_blank", "noopener");
    });
});
</script>
</body>
</html>
